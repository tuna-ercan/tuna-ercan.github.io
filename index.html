<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PageOfAPear</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Styles, in this order:
         1. variables.css - all colours and sizes (change things here)
         2. common.css    - parts shared by every page (menu, footer, ...)
         3. this page's own styles -->
    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/index_style.css" />
</head>
<body>
    <!-- Scroll progress bar on the right edge (styled in common.css, moved by main.js) -->
    <div id="progressBar"></div>
    <div id="scrollPath"></div>

    <!-- #all wraps the whole page; it slides right when the menu opens -->
    <section class="page" id="all">

    <!-- Menu icon (top left) -->
    <header>
        <div id="toggle"></div>
    </header>

    <!-- Banner photo with the round profile picture -->
    <section class="homePhotoSection">
        <img src="images/myPhoto.jpg"/>
    </section>

    <!-- Greeting text and three photos -->
    <section  class="welcome">
        <div>
            Hi! <br> <br>
            I'm a fourth-year mechanical engineering student at METU. <br>
            And on this page, you can find some of my hobby-work.
            <br><br><br>
        </div>

        <ul>
            <li> <img src="images/1f.JPG"/> </li>
            <li> <img src="images/2f.JPG"/> </li>
            <li> <img src="images/3f.JPG"/> </li>
        </ul>
    </section>

    <!-- Slide-out menu (hidden off the left edge until the icon is clicked) -->
    <div id="navigation">
        <ul>
            <li><a href="index.html">Welcome</a></li>
            <li><a href="pages/projects.html">Projects</a></li>
            <li><a href="pages/gallery.html">Gallery</a></li>
            <li><a href="pages/info.html">Info</a></li>
        </ul>
    </div>

    </section>

    <!-- Footer bar at the bottom of the window -->
    <footer id="nameFooter"><div> © 2026 Tuna Ercan</div></footer>

    <!-- Menu and progress bar behaviour, shared by every page -->
    <script src="scripts/main.js"></script>
</body>
</html>
