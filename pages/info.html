<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PageOfAPear</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Styles, in this order:
         1. variables.css - all colours and sizes (change things here)
         2. common.css    - parts shared by every page (menu, footer, ...)
         3. this page's own styles -->
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/common.css" />
    <link rel="stylesheet" href="../styles/info_style.css" />
</head>
<body>
    <!-- Scroll progress bar on the right edge (styled in common.css, moved by main.js) -->
    <div id="progressBar"></div>
    <div id="scrollPath"></div>

    <!-- #all wraps the whole page; it slides right when the menu opens -->
    <section class="page" id="all">

        <!-- Menu icon (top left) -->
        <header>
            <div id="toggle"></div>
        </header>

        <!-- Card, top block: title, text and contact links -->
        <section id="secBackground">

            <!-- Title at the top centre of the card -->
            <h1>Hi There!</h1>

            <div id="space"></div>

            <p id="studentTxt">I'm a fourth-year mechanical engineering student at METU, who really likes science and technology.</p>
            <a class="contact-link" href="https://github.com/tuna-ercan">GitHub</a>
            <a class="contact-link" href="mailto:tuna.ercan@metu.edu.tr">Send a Mail</a>
            <a class="contact-link" href="https://www.linkedin.com/in/tuna-ercan-4a1bb3197/">LinkedIn</a>
        </section>

        <!-- Card, white gap -->
        <div id="space__"></div>

        <!-- Card, smiley face (eyes follow the mouse, see scripts/info.js) -->
        <section id="faceSec">
            <div class="face">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
        </section>

        <!-- Card, bottom white gap -->
        <div id="space_"></div>

        <!-- Slide-out menu (hidden off the left edge until the icon is clicked) -->
        <div id="navigation">
            <ul>
                <li><a href="../index.html">Welcome</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="info.html">Info</a></li>
            </ul>
        </div>

    </section>

    <!-- Footer bar at the bottom of the window -->
    <footer><div> © 2026 Tuna Ercan</div></footer>

    <!-- Menu and progress bar behaviour, shared by every page -->
    <script src="../scripts/main.js"></script>
    <!-- Moving eyes, only on this page -->
    <script src="../scripts/info.js"></script>
</body>
</html>
