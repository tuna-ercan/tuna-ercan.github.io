<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PageOfAPear</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Styles, in this order:
         1. variables.css - all colours and sizes (change things here)
         2. common.css    - parts shared by every page (menu, footer, ...)
         3. this page's own styles -->
    <link rel="stylesheet" href="../styles/variables.css?v=4" />
    <link rel="stylesheet" href="../styles/common.css?v=4" />
    <link rel="stylesheet" href="../styles/gallery_style.css?v=4" />
</head>
<body>
    <!-- Scroll progress bar on the right edge (styled in common.css, moved by main.js) -->
    <div id="progressBar"></div>
    <div id="scrollPath"></div>

    <!-- #all wraps the whole page; it slides right when the menu opens -->
    <section class="page" id="all">

        <!-- Menu icon (top left) -->
        <header>
            <div id="toggle"></div>
        </header>

        <!-- Link at the top centre -->
        <a id="instaLink" href="https://www.instagram.com/photo_and_pear/">Instagram Page</a>

        <!-- White card with the photos: the Instagram feed first,
             then your own photos below it -->
        <section id="secBackground">
            <div id="space"></div>

            <!-- Instagram feed from @photo_and_pear, shown by Behold (behold.so).
                 It updates by itself when you post on Instagram (the free
                 plan shows the latest 6 posts, refreshed once a day).
                 Its layout (columns, spacing, corners) is set in your
                 Behold dashboard, not here. -->
            <behold-widget feed-id="VwFMHT0ixDUHdQXHCttm"></behold-widget>

            <!-- Your own photos, two per row. To add photos, copy a whole
                 <div class="row">...</div> block and change the file names
                 (the files go in images/gallery/). -->
            <div class="row">
                <div class="col"><img src="../images/gallery/1f.JPG" ></div>
                <div class="col"><img src="../images/gallery/2f.JPG" ></div>
            </div>

            <div class="row">
                <div class="col"><img src="../images/gallery/3f.JPG" ></div>
                <div class="col"><img src="../images/gallery/4f.JPG" ></div>
            </div>

            <div class="row">
                <div class="col"><img src="../images/gallery/5f.JPG" ></div>
                <div class="col"><img src="../images/gallery/6f.JPG" ></div>
            </div>

            <div class="row">
                <div class="col"><img src="../images/gallery/7f.JPG" ></div>
                <div class="col"><img src="../images/gallery/8f.JPG" ></div>
            </div>

            <div class="row">
                <div class="col"><img src="../images/gallery/9f.JPG" ></div>
                <div class="col"><img src="../images/gallery/10f.JPG" ></div>
            </div>

            <div class="row">
                <div class="col"><img src="../images/gallery/11f.JPG" ></div>
                <div class="col"><img src="../images/gallery/12f.JPG" ></div>
            </div>

            <div class="row">
                <div class="col"><img src="../images/gallery/13f.JPG" ></div>
                <div class="col"><img src="../images/gallery/14f.JPG" ></div>
            </div>

            <div class="row">
                <div class="col"><img src="../images/gallery/15f.JPG" ></div>
                <div class="col"><img src="../images/gallery/16f.JPG" ></div>
            </div>

            <a id="vscoLink" href="https://vsco.co/mpoire/gallery">VSCO</a>

            <div id="space_"></div>
        </section>

        <!-- Slide-out menu (hidden off the left edge until the icon is clicked) -->
        <div id="navigation">
            <ul>
                <li><a href="../index.html">Welcome</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="info.html">Info</a></li>
            </ul>
        </div>

    </section>

    <!-- Footer bar at the bottom of the window -->
    <footer><div> © 2026 Tuna Ercan</div></footer>

    <!-- Menu and progress bar behaviour, shared by every page -->
    <script src="../scripts/main.js?v=4"></script>

    <!-- Loads Behold's widget code, which fills in <behold-widget> above
         (this is the snippet from the Behold dashboard, unchanged) -->
    <script>
      (() => {
        if(window.__bhldScript)return;window.__bhldScript=true;
        const d=document,s=d.createElement("script");s.type="module";
        s.src="https://w.behold.so/widget.js";setTimeout(()=>{d.head.append(s);},0);
      })();
    </script>
</body>
</html>
